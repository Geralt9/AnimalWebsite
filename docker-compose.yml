services:

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${SQLKEY}
      MYSQL_DATABASE: cats_api
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./DataBackup/DataBackup.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
      start_period: 30s

  backend:
    build: ./Backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      SQLKEY: ${SQLKEY}
      PORT: 8080
      NODE_ENV: production
      ALLOWED_ORIGIN: http://localhost:5173
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_SECRET_KEY: ${CLOUDINARY_SECRET_KEY}
      API_KEY: ${API_KEY}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./UI
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
